org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle 8.9 does not run on JDK 25 (class file 69). Pin JDK 21 for daemon + Android compile.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Include native debug metadata in release AAB for Play Console crash reports (MapLibre .so).
android.bundle.enableNativeDebugMetadata=true
