# Marine Weather marketing site (static). Install on VPS:
#   cp docs/website/nginx/marine-weather-locations.conf /etc/nginx/snippets/
# Include in server blocks that should serve /marine-weather/ (safelight.fi + default IP vhost).

location = /marine-weather {
    return 302 /marine-weather/;
}

location /marine-weather/ {
    root /var/www;
    try_files $uri $uri/ /marine-weather/index.html;
}

# Digitraffic AIS REST proxy for /marine-weather/track/ (same-origin, no CORS).
location /marine-weather/api/ais/ {
    gzip off;
    proxy_pass https://meri.digitraffic.fi/api/ais/;
    proxy_ssl_server_name on;
    proxy_set_header Host meri.digitraffic.fi;
    proxy_set_header Digitraffic-User "MarineWeather/web-track (safelight.fi)";
    proxy_set_header Accept-Encoding gzip;
}
